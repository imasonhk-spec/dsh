# ═══════════════════════════════════════════════════════════════════
# 智汇·项目 / 智汇·商机 —— 同源反代（2026-10-23 部署）
# 装配位置：/etc/nginx/sites-enabled/dsh-web 的 server { } 块内，位于 `location /` 之前
#   include /etc/nginx/zhihui-locations.conf;
#
# 架构：
#   /zhihui/project/      → 127.0.0.1:3200  sidecar（静态 + /zhihui/project/api → 3100）
#   /zhihui/opportunity/  → 127.0.0.1:3210  sidecar（静态 + opp-api/shared-api 反代）
#   /opp-api/、/shared-api/ → 127.0.0.1:3210（商机前端硬编码的绝对路径）
#   /zhihui-sso/          → 127.0.0.1:3220  SSO 换票（dsh_mu_user → zh_session）
# ═══════════════════════════════════════════════════════════════════

location = /zhihui/project { return 301 /zhihui/project/; }
location ^~ /zhihui/project/ {
    proxy_pass http://127.0.0.1:3200;
    include /etc/nginx/zhihui-proxy-common.conf;
    client_max_body_size 64m;
}

location = /zhihui/opportunity { return 301 /zhihui/opportunity/; }
location ^~ /zhihui/opportunity/ {
    proxy_pass http://127.0.0.1:3210;
    include /etc/nginx/zhihui-proxy-common.conf;
    client_max_body_size 64m;
}

location ^~ /opp-api/ {
    proxy_pass http://127.0.0.1:3210;
    include /etc/nginx/zhihui-proxy-common.conf;
    client_max_body_size 64m;
}

location ^~ /shared-api/ {
    proxy_pass http://127.0.0.1:3210;
    include /etc/nginx/zhihui-proxy-common.conf;
    client_max_body_size 64m;
}

location ^~ /zhihui-sso/ {
    proxy_pass http://127.0.0.1:3220;
    include /etc/nginx/zhihui-proxy-common.conf;
    client_max_body_size 8m;
}
