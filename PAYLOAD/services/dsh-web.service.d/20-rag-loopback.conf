# 2026-09-14  RAG sidecar 收回 loopback
#
# 隔离在此之前只做在网关层：/rag/* 按会话路由到本账号 sidecar。但 sidecar 自身
# 监听 0.0.0.0 且未配置 token（server.py 里 token 为空则 _require_token 整体
# 关闭），于是同网段任何主机都能直连 17321/32xxx 读到宿主个人库与共享库清单，
# 隔离被完全绕过。实测：curl http://192.168.8.6:17321/documents -> HTTP 200。
#
# HOST 的取值顺序是 `RAG_SIDECAR_HOST` 环境变量 > config["host"]。放环境变量
# 只需一处：宿主进程带上了，supervisor 用 {...process.env} spawn 出来的用户
# 实例会自动继承，12 份 config.json 一份都不用动。所有正常链路（网关 /rag/*
# 转发、用户实例 /shared/* 转发到宿主 17321）走的都是 127.0.0.1，不受影响。
[Service]
Environment="RAG_SIDECAR_HOST=127.0.0.1"
