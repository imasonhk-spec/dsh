# 2026-10-10: sidecar（多用户网关为每个账号拉起的实例）原先完全不带
# --trusted-host，于是经 https://dsh.ilica.cn 访问时页面被判为非 loopback，
# DSH 禁止浏览器读写设置 → 「settings are unavailable in this browser」。
# 该变量由 dsh-multi-user 的 supervisor 读取并展开成 --trusted-host 参数。
# 不带端口 = 匹配该主机名的任意端口。多个权威用逗号分隔。
#
# 2026-10-20: 补入本机各网卡地址。原先只有 dsh.ilica.cn，浏览器改用
#   https://10.18.105.4:3082/（无线直连）访问时页面同样被判非 loopback，
#   设置页报「settings are unavailable in this browser」。
#   注意 admin 账号的 profile patch 里 connection.trustedHosts 覆盖了本变量，
#   改这里对 admin 无效，两处必须同步维护：
#     /home/lgsj/.dsh/multi-user/users/<账号>/home/profiles/web/cordis.patch.yml
#   机器 IP 变化（DHCP/换网口）时同样两处都要改。
[Service]
Environment=DSH_MU_TRUSTED_HOSTS=dsh.ilica.cn,10.18.105.4,192.168.8.6,192.168.10.6,192.168.10.9,100.100.8.6
