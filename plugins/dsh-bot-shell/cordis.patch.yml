# dsh-bot-shell — bundle patch.
#
# Inserts the host row that registers the same-origin `/bot` mount on the host
# DSH web server and reverse-proxies it to the dedicated Bot instance.
#
# NOTE: this row is inserted ONCE by the bundle patch; do NOT insert it again in
# a profile's cordis.patch.yml (duplicate ids crash the loader). A profile that
# needs different values overrides them with `- id: bot-shell` + `config:`.
- insert:
    - id: bot-shell
      name: dsh-bot-shell
      config:
        # 🔴 Self-gating: the shell only turns on in the instance whose DSH_HOME
        # equals this. Every other account that receives this bundle (the
        # multi-user gateway mirrors the host profile to all of them) gets a
        # disabled /bot that answers /bot/__status with {enabled:false}, so no
        # cross-account entry can appear.
        ownerHome: /home/lgsj/.dsh/multi-user/users/admin/home
        # Loopback port of the dedicated Bot instance (its own DSH_HOME).
        botPort: 31097
        # Empty ⇒ read from <botHome>/.web-token at apply time.
        botToken: ''
        botHome: /home/lgsj/.dsh/multi-user/users/admin/bot-home
        mount: /bot
